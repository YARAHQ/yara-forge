# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Run YARA-Forge

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Check out repository with submodules
      uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
  
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # Root requirements also cover the pinned QA submodule. Installing its
        # requirements would reintroduce the incompatible fb-re2 extension.

    - name: Run YARA-Forge
      run: |
        python yara-forge.py

    - name: Upload build statistics
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-statistics
        path: build_stats.md
        retention-days: 30

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: yara-forge.log
        retention-days: 30

    - name: Upload rule issues
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: rule-issues
        path: yara-forge-rule-issues.yml
        retention-days: 30
